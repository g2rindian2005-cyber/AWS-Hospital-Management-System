name: CI/CD Pipeline

# Build and test every pull request. A push to main (or a manual run from
# main) also deploys the application to the existing AWS environment:
# Lambda code + dependency layer, then the frontend to S3, with an
# optional EC2 refresh when an SSH key secret is configured.
#
# Infrastructure itself is still managed by Terraform from the repo's
# terraform/ directory; this workflow deliberately does NOT run
# `terraform apply`, because the Terraform state is not stored in GitHub.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'hospital' }}
  # IMPORTANT: the default is only a placeholder. After every fresh
  # Terraform deploy, set the repo variable API_BASE_URL to the new
  # api_gateway_url output, or the frontend gets baked with a dead URL.
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://abc123.execute-api.us-east-1.amazonaws.com/prod' }}
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET || 'hospital-management-frontend-bucket' }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Test frontend JavaScript syntax
        run: python scripts/validate_frontend.py

      - name: Compile all Lambda Python code
        run: python -m compileall -q backend

      - name: Install Lambda test dependencies
        run: python -m pip install -r backend/patient-lambda/requirements.txt

      - name: Import-test Lambda handlers
        run: |
          set -euo pipefail
          for dir in backend/patient-lambda backend/billing-lambda backend/disease-lambda backend/doctor-lambda backend/lab-lambda backend/pharmacy-lambda backend/db-init-lambda; do
            echo "Importing $dir"
            (cd "$dir" && python -c "import lambda_function; assert callable(lambda_function.lambda_handler)")
          done

      - name: Smoke test OTP auth Lambda
        env:
          AUTH_USERNAME: admin
          AUTH_EMAIL: admin@example.com
          AUTH_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret
        run: |
          PYTHONPATH=backend/auth-lambda python - <<'PY'
          import lambda_function

          response = lambda_function.lambda_handler(
              {"httpMethod": "OPTIONS", "path": "/auth/login"}, None
          )
          assert response["statusCode"] == 200, response
          print("Auth Lambda smoke test passed")
          PY

      - name: Build Lambda dependency layer
        run: |
          set -euo pipefail
          rm -rf terraform/build/layer terraform/build/deps-layer.zip dist
          mkdir -p terraform/build/layer/python dist/layer
          python -m pip install \
            -r backend/patient-lambda/requirements.txt \
            --target terraform/build/layer/python
          (cd terraform/build/layer && zip -qr ../deps-layer.zip python)
          cp terraform/build/deps-layer.zip dist/layer/deps-layer.zip

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Build frontend and Lambda packages
        run: |
          set -euo pipefail
          mkdir -p dist/frontend dist/lambda
          cp -R frontend/. dist/frontend/
          python - <<'PY'
          import os
          from pathlib import Path

          api_base = os.environ["API_BASE_URL"].rstrip("/")
          api_file = Path("dist/frontend/js/api.js")
          source = api_file.read_text(encoding="utf-8")
          placeholder = "https://abc123.execute-api.us-east-1.amazonaws.com/prod"
          if placeholder not in source:
              raise SystemExit("API placeholder was not found in frontend/js/api.js")
          api_file.write_text(source.replace(placeholder, api_base), encoding="utf-8")
          print(f"Frontend API configured for {api_base}")
          PY

          declare -A services=(
            [patient]="patient-lambda"
            [billing]="billing-lambda"
            [disease]="disease-lambda"
            [doctor]="doctor-lambda"
            [auth]="auth-lambda"
            [lab]="lab-lambda"
            [pharmacy]="pharmacy-lambda"
          )
          for name in "${!services[@]}"; do
            (cd "backend/${services[$name]}" && zip -qr "$GITHUB_WORKSPACE/dist/lambda/$name.zip" . -x '__pycache__/*' '*.pyc')
          done

          # db-init package: handler + the SQL files it runs. The single
          # source of truth for the SQL stays in database/.
          rm -rf /tmp/db-init-stage
          mkdir -p /tmp/db-init-stage/sql
          cp backend/db-init-lambda/lambda_function.py /tmp/db-init-stage/
          cp database/hospital_patients/patients.sql database/hospital_patients/patients_sample_data.sql \
             database/hospital_doctors/doctors.sql database/hospital_doctors/doctor_assignments.sql database/hospital_doctors/doctors_sample_data.sql \
             database/hospital_diseases/diseases.sql database/hospital_diseases/diseases_sample_data.sql \
             database/hospital_billing/bills.sql database/hospital_billing/payments.sql database/hospital_billing/billing_sample_data.sql \
             database/hospital_lab/laboratory.sql database/hospital_lab/lab_sample_data.sql \
             database/hospital_pharmacy/pharmacy.sql database/hospital_pharmacy/pharmacy_sample_data.sql \
             /tmp/db-init-stage/sql/
          (cd /tmp/db-init-stage && zip -qr "$GITHUB_WORKSPACE/dist/lambda/db-init.zip" .)
          find dist -type f -print

      - name: Package build artifact
        run: zip -qr hospital-build.zip dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-build-${{ github.sha }}
          path: hospital-build.zip
          retention-days: 14

  deploy:
    name: Deploy to AWS
    needs: build-test
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://g2rindian2005-cyber.github.io/AWS-Hospital-Management-System/login.html
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-build-${{ github.sha }}

      - name: Unpack build artifact
        run: unzip -q hospital-build.zip

      - name: Check required deployment secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Missing GitHub secrets. Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: aws sts get-caller-identity

      - name: Deploy Lambda functions and dependency layer
        run: |
          set -euo pipefail
          layer_arn=$(aws lambda publish-layer-version \
            --layer-name "$PROJECT_NAME-deps" \
            --description "GitHub Actions $GITHUB_SHA" \
            --zip-file "fileb://dist/layer/deps-layer.zip" \
            --compatible-runtimes python3.11 \
            --query LayerVersionArn --output text)
          echo "Published dependency layer: $layer_arn"
          echo "LAYER_ARN=$layer_arn" >> "$GITHUB_ENV"

          for service in patient billing disease doctor auth lab pharmacy; do
            function_name="$PROJECT_NAME-$service-service"
            echo "Deploying $function_name"
            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file "fileb://dist/lambda/$service.zip" \
              --publish >/dev/null
            aws lambda wait function-updated --function-name "$function_name"
            aws lambda update-function-configuration \
              --function-name "$function_name" \
              --layers "$layer_arn" >/dev/null
            aws lambda wait function-updated --function-name "$function_name"
          done

      - name: Initialise databases (tables + sample data)
        run: |
          set -euo pipefail
          # Automatic — no manual SQL step. Creates the db-init function
          # if Terraform has not created it yet, then runs it. The init
          # is idempotent, so re-running it on every deploy is safe.
          python3 scripts/ensure_db_init_lambda.py \
            --zip dist/lambda/db-init.zip \
            --layer-arn "$LAYER_ARN" \
            --project "$PROJECT_NAME"

      - name: Deploy frontend to S3
        run: |
          set -euo pipefail
          aws s3 sync dist/frontend/ "s3://$FRONTEND_BUCKET/" --delete
          echo "Frontend deployed to s3://$FRONTEND_BUCKET/"

      - name: Deploy frontend to GitHub Pages
        run: |
          set -euo pipefail
          # The gh-pages branch also carries js/config.js, which wins over
          # api.js' fallback. Rewrite it from the same API_BASE_URL so the
          # Pages site never points at a stale (dead-account) API.
          printf 'window.HMS_CONFIG = { apiBase: "%s" };\n' "$API_BASE_URL" \
            > dist/frontend/js/config.js
          echo "Pages config.js now points at $API_BASE_URL"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/frontend
          publish_branch: gh-pages
          commit_message: "Deploy frontend ${{ github.sha }}"

      - name: Refresh EC2 frontend when SSH is configured
        continue-on-error: true
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "EC2_SSH_KEY is not configured; skipping the EC2 copy. The S3 deployment above still succeeded."
            exit 0
          fi

          if [ -z "${EC2_HOST:-}" ]; then
            echo "EC2_HOST is not configured; skipping the EC2 copy."
            exit 0
          fi
          host="$EC2_HOST"
          user="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/hospital-key.pem
          chmod 600 ~/.ssh/hospital-key.pem
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts

          tar -C dist/frontend -czf /tmp/frontend.tgz .
          scp -i ~/.ssh/hospital-key.pem /tmp/frontend.tgz "$user@$host:/tmp/frontend.tgz"
          ssh -i ~/.ssh/hospital-key.pem "$user@$host" '
            sudo mkdir -p /var/www/hospital &&
            sudo tar -xzf /tmp/frontend.tgz -C /var/www/hospital &&
            sudo chown -R www-data:www-data /var/www/hospital &&
            (sudo systemctl reload nginx || sudo service nginx reload || true)
          '
          echo "EC2 frontend refreshed at $host"

      - name: Smoke test live deployment
        run: |
          set -euo pipefail
          site="http://$FRONTEND_BUCKET.s3-website.$AWS_REGION.amazonaws.com"

          echo "Checking S3 site: $site"
          curl -fsS "$site/login.html" -o /tmp/login.html \
            || { echo "::error::S3 site did not answer at $site — is the frontend bucket deployed?"; exit 1; }
          grep -q 'id="step2"' /tmp/login.html
          curl -fsS "$site/js/api.js" -o /tmp/api.js
          grep -Fq "$API_BASE_URL" /tmp/api.js
          echo "Checking API: $API_BASE_URL"
          curl -s -o /dev/null "$API_BASE_URL/auth/login" \
            || { echo "::error::API did not resolve at $API_BASE_URL — the backend (API Gateway/Lambda) is not deployed, or API_BASE_URL is stale. After a fresh Terraform deploy, set the repo variable API_BASE_URL to the new terraform output."; exit 1; }

          auth_status=$(curl -s -o /tmp/auth-smoke.json -w '%{http_code}' \
            -X POST "$API_BASE_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke-invalid","password":"invalid"}')
          if [ "$auth_status" != "401" ]; then
            echo "Expected auth smoke test to return 401, got $auth_status"
            cat /tmp/auth-smoke.json
            exit 1
          fi

          # Data-endpoint check: real login (the OTP is shown on screen
          # while SES is unverified), then GET /patients must return 200.
          # A dead/uninitialised database fails HERE in CI — never again
          # as a blank 502 in front of a user.
          login_resp=$(curl -s -X POST "$API_BASE_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}')
          challenge=$(printf '%s' "$login_resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('challenge',''))")
          dev_otp=$(printf '%s' "$login_resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('dev_otp',''))")
          if [ -z "$dev_otp" ]; then
            echo "OTP is emailed (SES verified) — skipping live data check; login itself passed."
          else
            token=$(curl -s -X POST "$API_BASE_URL/auth/verify-otp" \
              -H 'Content-Type: application/json' \
              -d "{\"challenge\":\"$challenge\",\"otp\":\"$dev_otp\"}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
            [ -n "$token" ] || { echo "::error::OTP verify did not return a token"; exit 1; }
            patients_status=$(curl -s -o /tmp/patients.json -w '%{http_code}' "$API_BASE_URL/patients" -H "Authorization: Bearer $token")
            if [ "$patients_status" != "200" ]; then
              echo "::error::GET /patients returned $patients_status — the database is not reachable or not initialised. Check RDS + SQL init (README STEP 4)."
              cat /tmp/patients.json
              exit 1
            fi
            echo "Live data check passed: /patients returned 200"
          fi
          echo "Live smoke tests passed"

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Hospital CI/CD deployment"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- API: $API_BASE_URL"
            echo "- S3 site: http://$FRONTEND_BUCKET.s3-website.$AWS_REGION.amazonaws.com/login.html"
            echo "- Pages site: https://g2rindian2005-cyber.github.io/AWS-Hospital-Management-System/login.html"
            echo "- Lambdas: patient, billing, disease, doctor, auth, lab, pharmacy, db-init (databases auto-initialised)"
          } >> "$GITHUB_STEP_SUMMARY"

