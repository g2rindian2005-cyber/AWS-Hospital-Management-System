<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing — MediCore HMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=4">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-in">

      <div class="page-header">
        <div class="page-header-left">
          <h1>Billing Management</h1>
          <p>Create invoices and manage all patient bills</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('createBillModal').classList.add('show')">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            New Invoice
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:20px;">
        <div class="stat-card stat-blue"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div><div class="stat-info"><div class="stat-value" id="totalBills">—</div><div class="stat-label">Total Bills</div></div></div>
        <div class="stat-card stat-green"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div><div class="stat-info"><div class="stat-value" id="paidBills">—</div><div class="stat-label">Paid</div></div></div>
        <div class="stat-card stat-amber"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-info"><div class="stat-value" id="partialBills">—</div><div class="stat-label">Partial</div></div></div>
        <div class="stat-card stat-red"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div><div class="stat-info"><div class="stat-value" id="pendingBills">—</div><div class="stat-label">Pending</div></div></div>
      </div>

      <!-- Bills Table -->
      <div class="card">
        <div class="table-toolbar">
          <div class="table-search">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="billSearch" placeholder="Search by patient, bill ID…">
          </div>
          <div class="table-filters">
            <select class="form-control" id="billStatusFilter" style="width:auto;padding:7px 12px;">
              <option value="">All Statuses</option>
              <option>Paid</option><option>Partial</option><option>Pending</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Invoice #</th><th>Patient</th><th>Description</th>
                <th>Category</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="billTable"><tr><td colspan="8"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
        <div class="pagination" id="billPagination"></div>
      </div>

    </div>
  </div>
</div>

<!-- Create Bill Modal -->
<div class="modal-overlay" id="createBillModal">
  <div class="modal modal-lg fade-in">
    <div class="modal-header">
      <h3>Generate New Invoice</h3>
      <button class="modal-close" onclick="document.getElementById('createBillModal').classList.remove('show')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Patient <span class="required">*</span></label>
          <select class="form-control" id="billPatient" required>
            <option value="">— Select patient —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Category <span class="required">*</span></label>
          <select class="form-control" id="billCategory">
            <option>Consultation</option><option>Lab Test</option>
            <option>Surgery</option><option>Medicine</option>
            <option>Room Charges</option><option>Other</option>
          </select>
        </div>
        <div class="form-group full">
          <label class="form-label">Description <span class="required">*</span></label>
          <input type="text" class="form-control" id="billDesc" placeholder="e.g. Cardiology consultation + ECG">
        </div>
      </div>

      <div class="divider"></div>
      <div style="font-size:13px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.5px; margin-bottom:14px;">Charge Breakdown</div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Consultation Fee (₹)</label>
          <input type="number" class="form-control" id="feeConsult" placeholder="0" min="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Medicine Charges (₹)</label>
          <input type="number" class="form-control" id="feeMedicine" placeholder="0" min="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Laboratory Charges (₹)</label>
          <input type="number" class="form-control" id="feeLab" placeholder="0" min="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Treatment Charges (₹)</label>
          <input type="number" class="form-control" id="feeTreatment" placeholder="0" min="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Room / Other Charges (₹)</label>
          <input type="number" class="form-control" id="feeOther" placeholder="0" min="0" oninput="calcTotal()">
        </div>
        <div class="form-group">
          <label class="form-label">Discount (₹)</label>
          <input type="number" class="form-control" id="discount" placeholder="0" min="0" oninput="calcTotal()">
        </div>
      </div>

      <div style="background:var(--blue-50); border:1px solid var(--blue-100); border-radius:var(--radius); padding:16px 20px; margin-top:8px;">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--gray-600); margin-bottom:6px;">
          <span>Subtotal</span><span id="subtotalDisplay">₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--gray-600); margin-bottom:8px;">
          <span>Discount</span><span id="discountDisplay">- ₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:800; color:var(--blue-700); border-top:1px solid var(--blue-200); padding-top:8px;">
          <span>Total Amount</span><span id="totalDisplay">₹0</span>
        </div>
      </div>

      <div class="form-grid mt-16">
        <div class="form-group">
          <label class="form-label">Payment Status</label>
          <select class="form-control" id="billStatus">
            <option>Pending</option><option>Partial</option><option>Paid</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Bill Date</label>
          <input type="date" class="form-control" id="billDate">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('createBillModal').classList.remove('show')">Cancel</button>
      <button class="btn btn-primary" id="saveBillBtn" onclick="saveBill()">Generate Invoice</button>
    </div>
  </div>
</div>

<!-- Invoice View Modal -->
<div class="modal-overlay" id="invoiceModal">
  <div class="modal modal-lg fade-in" style="max-width:760px;">
    <div class="modal-header">
      <h3>Invoice Preview</h3>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="window.print()">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
          Print
        </button>
        <button class="modal-close" onclick="document.getElementById('invoiceModal').classList.remove('show')">×</button>
      </div>
    </div>
    <div class="modal-body" style="padding:0;" id="invoiceContent"></div>
  </div>
</div>

<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  initApp({ page: 'create-bill', title: 'Billing', subtitle: 'Billing Management' });

  let allBills = [];

  function calcTotal() {
    const vals = ['feeConsult','feeMedicine','feeLab','feeTreatment','feeOther'].map(id => parseFloat(document.getElementById(id).value)||0);
    const sub  = vals.reduce((a,b) => a+b, 0);
    const disc = parseFloat(document.getElementById('discount').value)||0;
    const net  = Math.max(0, sub - disc);
    document.getElementById('subtotalDisplay').textContent  = formatCurrency(sub);
    document.getElementById('discountDisplay').textContent  = '- ' + formatCurrency(disc);
    document.getElementById('totalDisplay').textContent     = formatCurrency(net);
    return { amount: sub, net_amount: net };
  }

  async function init() {
    /* Populate patient select */
    const pd = await PatientsAPI.list();
    const sel = document.getElementById('billPatient');
    (pd?.patients||[]).forEach(p => {
      const o = document.createElement('option');
      o.value = p.patient_id;
      o.textContent = `PID-${String(p.patient_id).padStart(4,'0')} — ${p.first_name} ${p.last_name}`;
      sel.appendChild(o);
    });

    /* Set today's date */
    document.getElementById('billDate').value = new Date().toISOString().split('T')[0];

    /* Load bills */
    const data = await BillingAPI.listBills();
    allBills = data?.bills || [];

    const paid    = allBills.filter(b => b.status==='Paid').length;
    const partial = allBills.filter(b => b.status==='Partial').length;
    const pending = allBills.filter(b => b.status==='Pending').length;

    document.getElementById('totalBills').textContent   = allBills.length;
    document.getElementById('paidBills').textContent    = paid;
    document.getElementById('partialBills').textContent = partial;
    document.getElementById('pendingBills').textContent = pending;

    renderBillTable();
  }

  let billPage = 1;
  const perPage = 10;

  function getFilteredBills() {
    const q = document.getElementById('billSearch').value.toLowerCase();
    const s = document.getElementById('billStatusFilter').value;
    return allBills.filter(b => {
      const matchQ = !q || (b.patient_name||'').toLowerCase().includes(q) || String(b.bill_id).includes(q) || (b.description||'').toLowerCase().includes(q);
      const matchS = !s || b.status === s;
      return matchQ && matchS;
    });
  }

  function renderBillTable() {
    const filtered = getFilteredBills();
    const page = filtered.slice((billPage-1)*perPage, billPage*perPage);
    document.getElementById('billTable').innerHTML = page.length
      ? page.map(b => `
        <tr>
          <td class="fw-600">#INV-${String(b.bill_id).padStart(5,'0')}</td>
          <td>
            <div class="patient-cell">
              <div class="patient-avatar" style="width:28px;height:28px;font-size:10px;">${initials(b.patient_name||'')}</div>
              <span>${b.patient_name||'Patient #'+b.patient_id}</span>
            </div>
          </td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gray-500);">${b.description||'—'}</td>
          <td><span class="badge badge-gray">${b.category||'—'}</span></td>
          <td class="fw-600">${formatCurrency(b.net_amount)}</td>
          <td>${statusBadge(b.status)}</td>
          <td class="text-muted">${formatDate(b.bill_date)}</td>
          <td>
            <div class="d-flex gap-8">
              <button class="btn-icon btn-icon-view" onclick="viewInvoice(${JSON.stringify(b).replace(/"/g,'&quot;')})" title="View Invoice">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button class="btn-icon btn-icon-danger" onclick="deleteBill(${b.bill_id})" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          </td>
        </tr>`).join('')
      : `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div><h4>No bills found</h4><p>Create a new invoice to get started.</p></div></td></tr>`;
    buildPagination(document.getElementById('billPagination'), filtered.length, billPage, perPage, p => { billPage=p; renderBillTable(); });
  }

  document.getElementById('billSearch').addEventListener('input', () => { billPage=1; renderBillTable(); });
  document.getElementById('billStatusFilter').addEventListener('change', () => { billPage=1; renderBillTable(); });

  async function saveBill() {
    const pid  = document.getElementById('billPatient').value;
    const desc = document.getElementById('billDesc').value.trim();
    if (!pid || !desc) { showToast('Please fill in required fields.', 'warning'); return; }

    const { amount, net_amount } = calcTotal();
    const btn = document.getElementById('saveBillBtn');
    btn.textContent = 'Generating…'; btn.disabled = true;

    const body = {
      patient_id:   parseInt(pid),
      description:  desc,
      category:     document.getElementById('billCategory').value,
      amount:       amount,
      net_amount:   net_amount,
      status:       document.getElementById('billStatus').value,
      bill_date:    document.getElementById('billDate').value,
    };

    const res = await BillingAPI.createBill(body);
    btn.textContent = 'Generate Invoice'; btn.disabled = false;

    if (res) {
      showToast('Invoice generated successfully!', 'success');
      document.getElementById('createBillModal').classList.remove('show');
      await init();
    }
  }

  async function deleteBill(id) {
    const ok = await confirmDialog({ title:'Delete Invoice?', message:'This will permanently remove the billing record.', confirmText:'Delete Invoice' });
    if (!ok) return;
    const res = await BillingAPI.removeBill(id);
    if (res !== null) { showToast('Invoice deleted.', 'success'); await init(); }
  }

  function viewInvoice(b) {
    document.getElementById('invoiceContent').innerHTML = `
      <div class="invoice" style="border:none; border-radius:0; max-width:100%;">
        <div class="invoice-header">
          <div>
            <div class="invoice-logo"><span style="display:inline-flex;align-items:center;gap:8px;"><span style="display:inline-flex;width:30px;height:30px;background:linear-gradient(135deg,#2563eb,#0d9488);border-radius:8px;align-items:center;justify-content:center;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>MediCore Hospital</span></div>
            <div class="invoice-address">123 Healthcare Avenue, Medical District<br>Mumbai, Maharashtra — 400001<br>Phone: +91 22 1234 5678</div>
          </div>
          <div class="invoice-number">
            <div class="label">INVOICE</div>
            <div class="value">#INV-${String(b.bill_id).padStart(5,'0')}</div>
            <div style="font-size:13px; opacity:.7; margin-top:4px;">${formatDate(b.bill_date)}</div>
          </div>
        </div>
        <div class="invoice-meta">
          <div class="invoice-meta-section">
            <h4>Bill To</h4>
            <p><strong>${b.patient_name||'Patient #'+b.patient_id}</strong></p>
            <p>Patient ID: PID-${String(b.patient_id).padStart(4,'0')}</p>
          </div>
          <div class="invoice-meta-section">
            <h4>Invoice Details</h4>
            <p>Category: <strong>${b.category||'—'}</strong></p>
            <p>Status: <strong>${b.status}</strong></p>
          </div>
        </div>
        <div class="invoice-table" style="padding:0 32px;">
          <table>
            <thead><tr><th>Description</th><th class="text-right">Amount</th></tr></thead>
            <tbody>
              <tr><td>${b.description||'Medical services'}</td><td class="text-right fw-600">${formatCurrency(b.amount)}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="invoice-totals">
          <div class="invoice-total-row"><span>Subtotal</span><span>${formatCurrency(b.amount)}</span></div>
          <div class="invoice-total-row"><span>Discount</span><span>- ${formatCurrency((b.amount||0)-(b.net_amount||0))}</span></div>
          <div class="invoice-total-row grand"><span>Total Due</span><span>${formatCurrency(b.net_amount)}</span></div>
        </div>
        <div class="invoice-footer">
          Thank you for choosing MediCore Hospital. For queries, contact billing@medicore.in
        </div>
      </div>`;
    document.getElementById('invoiceModal').classList.add('show');
  }

  init();
</script>
</body>
</html>
