<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Receipt</title>
</head>
<body style="margin:0;padding:0;background:#f0f4f8;font-family:Segoe UI,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.08);">
        <tr>
          <td style="background:linear-gradient(135deg,#66bb6a,#43a047);padding:30px 40px;text-align:center;">
            <div style="font-size:48px;">✅</div>
            <h1 style="color:#fff;margin:10px 0 0 0;font-size:24px;">Payment Successful</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:35px 40px;">
            <h2 style="color:#2e7d32;margin-top:0;">Payment Receipt</h2>
            <table style="width:100%;margin:20px 0;border-collapse:collapse;">
              <tr style="border-bottom:1px solid #eee;">
                <td style="padding:12px 0;color:#78909c;">Receipt ID</td>
                <td style="padding:12px 0;text-align:right;font-weight:bold;color:#2e7d32;">#{{payment_id}}</td>
              </tr>
              <tr style="border-bottom:1px solid #eee;">
                <td style="padding:12px 0;color:#78909c;">Bill ID</td>
                <td style="padding:12px 0;text-align:right;font-weight:bold;">#{{bill_id}}</td>
              </tr>
              <tr style="background:#e8f5e9;">
                <td style="padding:15px 0;color:#2e7d32;font-weight:bold;font-size:18px;">Amount Paid</td>
                <td style="padding:15px 0;text-align:right;font-weight:bold;font-size:22px;color:#2e7d32;">₹ {{amount}}</td>
              </tr>
            </table>
            <p style="color:#78909c;font-size:13px;line-height:1.6;">
              Thank you for your payment. Your bill status has been automatically updated in our system.
              Please keep this receipt for your records.
            </p>
          </td>
        </tr>
        <tr>
          <td style="background:#f5f5f5;padding:20px 40px;text-align:center;">
            <p style="color:#90a4ae;font-size:12px;margin:0;">© 2026 AWS Hospital Management System</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
