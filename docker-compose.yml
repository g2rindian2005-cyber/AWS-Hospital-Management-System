# MediCore Hospital — full local stack (frontend + backend + MySQL).
#
#   docker compose up --build
#   Frontend: http://localhost:8080/login.html   (admin / admin123 + OTP)
#   Backend:  http://localhost:8081/healthz
#   MySQL:    localhost:3306 (root / hospital_root_pw, app user admin)
#
# The OTP code is shown on the login page itself in this local setup
# (no email server configured), exactly like the AWS site behaves until
# its sender address is verified. Production keeps running on AWS
# Lambda + RDS; this stack changes nothing there.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: hospital_root_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/sql:ro
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phospital_root_pw"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: admin
      DB_PASSWORD: hospital_local_pw
      AUTH_USERNAME: admin
      AUTH_EMAIL: admin@example.com
      AUTH_PASSWORD: admin123
      JWT_SECRET: local-dev-jwt-secret
      PORT: "8080"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
