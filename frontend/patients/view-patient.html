<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients — MediCore Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-in">

      <div class="page-header">
        <div class="page-header-left">
          <h1>Patient Management</h1>
          <p>View, search, and manage all registered patients</p>
        </div>
        <div class="page-header-actions">
          <a href="add-patient.html" class="btn btn-primary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            Register Patient
          </a>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:20px;" id="patientStats">
        <div class="stat-card stat-blue">
          <div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div class="stat-info"><div class="stat-value" id="totalPatients">—</div><div class="stat-label">Total Patients</div></div>
        </div>
        <div class="stat-card stat-teal">
          <div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="stat-info"><div class="stat-value" id="maleCount">—</div><div class="stat-label">Male Patients</div></div>
        </div>
        <div class="stat-card stat-purple">
          <div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div class="stat-info"><div class="stat-value" id="femaleCount">—</div><div class="stat-label">Female Patients</div></div>
        </div>
        <div class="stat-card stat-green">
          <div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></div>
          <div class="stat-info"><div class="stat-value" id="recentCount">—</div><div class="stat-label">This Month</div></div>
        </div>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <div class="table-search">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Search by name, ID, phone…">
          </div>
          <div class="table-filters">
            <select class="form-control" id="filterGender" style="width:auto; padding:7px 12px;">
              <option value="">All Genders</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
            <select class="form-control" id="filterBlood" style="width:auto; padding:7px 12px;">
              <option value="">All Blood Groups</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>O+</option><option>O-</option>
              <option>AB+</option><option>AB-</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Patient</th>
                <th>Patient ID</th>
                <th>Age / DOB</th>
                <th>Gender</th>
                <th>Blood Group</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Registered</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="patientTable">
              <tr><td colspan="9"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>

    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal fade-in">
    <div class="modal-header">
      <h3>Edit Patient</h3>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">First Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="editFirstName">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name <span class="required">*</span></label>
          <input type="text" class="form-control" id="editLastName">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" id="editPhone">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="editEmail">
        </div>
        <div class="form-group">
          <label class="form-label">Date of Birth</label>
          <input type="date" class="form-control" id="editDob">
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select class="form-control" id="editGender">
            <option>Male</option><option>Female</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Blood Group</label>
          <select class="form-control" id="editBlood">
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
          </select>
        </div>
        <input type="hidden" id="editPatientId">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  initApp({ page: 'view-patient', title: 'Patients', subtitle: 'All Patients' });

  let allPatients = [];
  let currentPage = 1;
  const perPage = 10;

  async function loadPatients() {
    const data = await PatientsAPI.list();
    allPatients = data?.patients || [];
    const m = allPatients.filter(p => p.gender === 'Male').length;
    const f = allPatients.filter(p => p.gender === 'Female').length;
    const month = new Date().getMonth();
    const recent = allPatients.filter(p => new Date(p.registration_date).getMonth() === month).length;

    document.getElementById('totalPatients').textContent = allPatients.length;
    document.getElementById('maleCount').textContent = m;
    document.getElementById('femaleCount').textContent = f;
    document.getElementById('recentCount').textContent = recent;
    renderTable();
  }

  function getFiltered() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const g = document.getElementById('filterGender').value;
    const b = document.getElementById('filterBlood').value;
    return allPatients.filter(p => {
      const name = `${p.first_name} ${p.last_name}`.toLowerCase();
      const id = String(p.patient_id);
      const matchQ = !q || name.includes(q) || id.includes(q) || (p.phone||'').includes(q);
      const matchG = !g || p.gender === g;
      const matchB = !b || p.blood_group === b;
      return matchQ && matchG && matchB;
    });
  }

  function calcAge(dob) {
    if (!dob) return '—';
    const diff = Date.now() - new Date(dob).getTime();
    return Math.floor(diff / (365.25*24*3600*1000)) + ' yrs';
  }

  function renderTable() {
    const filtered = getFiltered();
    const start = (currentPage-1)*perPage;
    const page  = filtered.slice(start, start+perPage);

    document.getElementById('patientTable').innerHTML = page.length ? page.map(p => `
      <tr>
        <td>
          <div class="patient-cell">
            <div class="patient-avatar">${initials(p.first_name+' '+p.last_name)}</div>
            <div>
              <div class="patient-name">${p.first_name} ${p.last_name}</div>
              <div class="patient-id">${p.email||'—'}</div>
            </div>
          </div>
        </td>
        <td><span class="badge badge-info">PID-${String(p.patient_id).padStart(4,'0')}</span></td>
        <td>${calcAge(p.date_of_birth)}<br><span class="text-muted text-sm">${formatDate(p.date_of_birth)}</span></td>
        <td>${p.gender||'—'}</td>
        <td><span class="badge badge-gray">${p.blood_group||'—'}</span></td>
        <td>${p.phone||'—'}</td>
        <td class="text-muted">${p.email||'—'}</td>
        <td class="text-muted">${formatDate(p.registration_date)}</td>
        <td>
          <div class="d-flex gap-8">
            <button class="btn-icon btn-icon-edit" onclick="openEdit(${JSON.stringify(p).replace(/"/g,'&quot;')})" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-icon btn-icon-danger" onclick="deletePatient(${p.patient_id})" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </td>
      </tr>`) .join('')
    : `<tr><td colspan="9"><div class="empty-state">
        <div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
        <h4>No patients found</h4><p>Try adjusting your search filters.</p>
      </div></td></tr>`;

    buildPagination(document.getElementById('pagination'), filtered.length, currentPage, perPage, (p) => { currentPage=p; renderTable(); });
  }

  document.getElementById('searchInput').addEventListener('input', () => { currentPage=1; renderTable(); });
  document.getElementById('filterGender').addEventListener('change', () => { currentPage=1; renderTable(); });
  document.getElementById('filterBlood').addEventListener('change', () => { currentPage=1; renderTable(); });

  function openEdit(p) {
    document.getElementById('editPatientId').value = p.patient_id;
    document.getElementById('editFirstName').value = p.first_name;
    document.getElementById('editLastName').value  = p.last_name;
    document.getElementById('editPhone').value     = p.phone;
    document.getElementById('editEmail').value     = p.email;
    document.getElementById('editDob').value       = p.date_of_birth;
    document.getElementById('editGender').value    = p.gender;
    document.getElementById('editBlood').value     = p.blood_group;
    document.getElementById('editModal').classList.add('show');
  }

  async function saveEdit() {
    const id = document.getElementById('editPatientId').value;
    const body = {
      first_name:   document.getElementById('editFirstName').value,
      last_name:    document.getElementById('editLastName').value,
      phone:        document.getElementById('editPhone').value,
      email:        document.getElementById('editEmail').value,
      date_of_birth:document.getElementById('editDob').value,
      gender:       document.getElementById('editGender').value,
      blood_group:  document.getElementById('editBlood').value,
    };
    const btn = document.getElementById('saveEditBtn');
    btn.textContent = 'Saving…'; btn.disabled = true;
    const res = await PatientsAPI.update(id, body);
    btn.textContent = 'Save Changes'; btn.disabled = false;
    if (res) {
      showToast('Patient record updated successfully.', 'success');
      closeModal('editModal');
      await loadPatients();
    }
  }

  async function deletePatient(id) {
    const ok = await confirmDialog({ title:'Delete Patient?', message:'This will permanently remove the patient record and all associated data.', confirmText:'Delete Patient' });
    if (!ok) return;
    const res = await PatientsAPI.remove(id);
    if (res !== null) {
      showToast('Patient deleted successfully.', 'success');
      await loadPatients();
    }
  }

  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  loadPatients();
</script>
</body>
</html>
