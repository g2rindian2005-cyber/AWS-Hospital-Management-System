<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient History — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content fade-in">
      <div class="page-header">
        <h1>📋 Patient History</h1>
      </div>

      <div class="glass" style="padding:24px;margin-bottom:24px;">
        <div class="input-group" style="margin-bottom:0;">
          <label>Select Patient to View Synchronised History</label>
          <select id="patientSelect" style="max-width:400px;"></select>
        </div>
      </div>

      <div id="historyContent"></div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/patients.js"></script>
  <script>
    fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});
  </script>
</body>
</html>
