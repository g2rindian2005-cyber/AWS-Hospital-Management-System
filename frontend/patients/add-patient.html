<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Patient — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main -->
    <main class="main-content fade-in">
      <div class="page-header">
        <h1>➕ Add New Patient</h1>
        <a href="view-patient.html" class="btn btn-outline">View All Patients</a>
      </div>

      <div class="glass" style="padding:32px;max-width:700px;">
        <form id="addPatientForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
            <div class="input-group">
              <label>First Name *</label>
              <input type="text" name="first_name" placeholder="Rahul" required>
            </div>
            <div class="input-group">
              <label>Last Name *</label>
              <input type="text" name="last_name" placeholder="Sharma" required>
            </div>
            <div class="input-group">
              <label>Date of Birth *</label>
              <input type="date" name="date_of_birth" required>
            </div>
            <div class="input-group">
              <label>Gender *</label>
              <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="input-group">
              <label>Phone *</label>
              <input type="tel" name="phone" placeholder="9876543210" required>
            </div>
            <div class="input-group">
              <label>Email</label>
              <input type="email" name="email" placeholder="patient@email.com">
            </div>
            <div class="input-group">
              <label>Blood Group</label>
              <select name="blood_group">
                <option value="">— Select —</option>
                <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
              </select>
            </div>
            <div class="input-group">
              <label>Emergency Contact</label>
              <input type="tel" name="emergency_contact" placeholder="9123456780">
            </div>
            <div class="input-group" style="grid-column:1/3;">
              <label>Address</label>
              <textarea name="address" placeholder="Full address"></textarea>
            </div>
            <div class="input-group" style="grid-column:1/3;">
              <label>Insurance Number</label>
              <input type="text" name="insurance_number" placeholder="INS-XXXX">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">💾 Register Patient</button>
        </form>
        <p style="color:rgba(255,255,255,0.4);font-size:13px;text-align:center;margin-top:16px;">
          A registration confirmation email will be sent automatically via SES SMTP.
        </p>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/patients.js"></script>
  <script>
    fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});
  </script>
</body>
</html>
