<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseases — MediCore Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-in">

      <div class="page-header">
        <div class="page-header-left">
          <h1>Disease Management</h1>
          <p>Track patient diagnoses, treatments, and recovery</p>
        </div>
        <div class="page-header-actions">
          <a href="add-disease.html" class="btn btn-primary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            Add Diagnosis
          </a>
        </div>
      </div>

      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:20px;">
        <div class="stat-card stat-blue"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></div><div class="stat-info"><div class="stat-value" id="totalDiseases">—</div><div class="stat-label">Total Records</div></div></div>
        <div class="stat-card stat-amber"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div class="stat-info"><div class="stat-value" id="activeDiseases">—</div><div class="stat-label">Active</div></div></div>
        <div class="stat-card stat-red"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div><div class="stat-info"><div class="stat-value" id="severeDiseases">—</div><div class="stat-label">Severe Cases</div></div></div>
        <div class="stat-card stat-green"><div class="stat-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div><div class="stat-info"><div class="stat-value" id="recoveredDiseases">—</div><div class="stat-label">Recovered</div></div></div>
      </div>

      <div class="card">
        <div class="table-toolbar">
          <div class="table-search">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="diseaseSearch" placeholder="Search by patient, disease name…">
          </div>
          <div class="table-filters">
            <select class="form-control" id="severityFilter" style="width:auto;padding:7px 12px;">
              <option value="">All Severity</option>
              <option>Mild</option><option>Moderate</option><option>Severe</option><option>Chronic</option>
            </select>
            <select class="form-control" id="statusFilter" style="width:auto;padding:7px 12px;">
              <option value="">All Statuses</option>
              <option>Active</option><option>Under Treatment</option>
              <option>Chronic</option><option>Recovered</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Patient</th><th>Disease</th><th>Severity</th>
                <th>Status</th><th>Diagnosed</th><th>Follow-up</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="diseaseTable"><tr><td colspan="8"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
        <div class="pagination" id="diseasePagination"></div>
      </div>

    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editDiseaseModal">
  <div class="modal fade-in">
    <div class="modal-header">
      <h3>Update Disease Record</h3>
      <button class="modal-close" onclick="document.getElementById('editDiseaseModal').classList.remove('show')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editDiseaseId">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Disease Name</label>
          <input type="text" class="form-control" id="editDiseaseName">
        </div>
        <div class="form-group">
          <label class="form-label">Severity</label>
          <select class="form-control" id="editSeverity">
            <option>Mild</option><option>Moderate</option><option>Severe</option><option>Chronic</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" id="editDiseaseStatus">
            <option>Active</option><option>Under Treatment</option>
            <option>Chronic</option><option>Recovered</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Follow-up Date</label>
          <input type="date" class="form-control" id="editFollowup">
        </div>
        <div class="form-group full">
          <label class="form-label">Treatment Details</label>
          <textarea class="form-control" id="editTreatment" rows="3"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('editDiseaseModal').classList.remove('show')">Cancel</button>
      <button class="btn btn-primary" id="saveDiseaseBtn" onclick="saveDisease()">Save Changes</button>
    </div>
  </div>
</div>

<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  initApp({ page: 'disease-history', title: 'Diseases', subtitle: 'Clinical' });

  let allDiseases = [];
  let disPage = 1;
  const perPage = 10;

  async function init() {
    const data = await DiseasesAPI.list();
    allDiseases = data?.diseases || [];

    document.getElementById('totalDiseases').textContent    = allDiseases.length;
    document.getElementById('activeDiseases').textContent   = allDiseases.filter(d => ['Active','Under Treatment'].includes(d.status)).length;
    document.getElementById('severeDiseases').textContent   = allDiseases.filter(d => d.severity === 'Severe').length;
    document.getElementById('recoveredDiseases').textContent= allDiseases.filter(d => d.status === 'Recovered').length;
    renderTable();
  }

  function getFiltered() {
    const q = (document.getElementById('diseaseSearch').value||'').toLowerCase();
    const sev = document.getElementById('severityFilter').value;
    const st  = document.getElementById('statusFilter').value;
    return allDiseases.filter(d => {
      const matchQ  = !q || (d.patient_name||'').toLowerCase().includes(q) || (d.disease_name||'').toLowerCase().includes(q);
      const matchSev= !sev || d.severity === sev;
      const matchSt = !st  || d.status   === st;
      return matchQ && matchSev && matchSt;
    });
  }

  function renderTable() {
    const f = getFiltered();
    const page = f.slice((disPage-1)*perPage, disPage*perPage);
    document.getElementById('diseaseTable').innerHTML = page.length
      ? page.map(d => `
        <tr>
          <td class="fw-600">DID-${String(d.disease_id).padStart(4,'0')}</td>
          <td>
            <div class="patient-cell">
              <div class="patient-avatar" style="width:28px;height:28px;font-size:10px;">${initials(d.patient_name||'')}</div>
              <span>${d.patient_name||'Patient #'+d.patient_id}</span>
            </div>
          </td>
          <td class="fw-600">${d.disease_name||'—'}</td>
          <td>
            <div class="severity-bar sev-${(d.severity||'mild').toLowerCase()}">
              <div class="severity-track"><div class="severity-fill"></div></div>
              ${statusBadge(d.severity)}
            </div>
          </td>
          <td>${statusBadge(d.status)}</td>
          <td class="text-muted">${formatDate(d.diagnosis_date)}</td>
          <td class="text-muted">${formatDate(d.follow_up_date)}</td>
          <td>
            <div class="d-flex gap-8">
              <button class="btn-icon btn-icon-edit" onclick="openEditDisease(${JSON.stringify(d).replace(/"/g,'&quot;')})" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="btn-icon btn-icon-danger" onclick="deleteDisease(${d.disease_id})" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          </td>
        </tr>`).join('')
      : `<tr><td colspan="8"><div class="empty-state"><h4>No disease records found</h4></div></td></tr>`;
    buildPagination(document.getElementById('diseasePagination'), f.length, disPage, perPage, p => { disPage=p; renderTable(); });
  }

  document.getElementById('diseaseSearch').addEventListener('input', () => { disPage=1; renderTable(); });
  document.getElementById('severityFilter').addEventListener('change', () => { disPage=1; renderTable(); });
  document.getElementById('statusFilter').addEventListener('change', () => { disPage=1; renderTable(); });

  function openEditDisease(d) {
    document.getElementById('editDiseaseId').value     = d.disease_id;
    document.getElementById('editDiseaseName').value   = d.disease_name;
    document.getElementById('editSeverity').value      = d.severity;
    document.getElementById('editDiseaseStatus').value = d.status;
    document.getElementById('editFollowup').value      = d.follow_up_date?.split('T')[0] || '';
    document.getElementById('editTreatment').value     = d.treatment_details || '';
    document.getElementById('editDiseaseModal').classList.add('show');
  }

  async function saveDisease() {
    const id = document.getElementById('editDiseaseId').value;
    const btn = document.getElementById('saveDiseaseBtn');
    btn.textContent = 'Saving…'; btn.disabled = true;
    const body = {
      disease_name:      document.getElementById('editDiseaseName').value,
      severity:          document.getElementById('editSeverity').value,
      status:            document.getElementById('editDiseaseStatus').value,
      follow_up_date:    document.getElementById('editFollowup').value,
      treatment_details: document.getElementById('editTreatment').value,
    };
    const res = await DiseasesAPI.update(id, body);
    btn.textContent = 'Save Changes'; btn.disabled = false;
    if (res) {
      showToast('Disease record updated.', 'success');
      document.getElementById('editDiseaseModal').classList.remove('show');
      await init();
    }
  }

  async function deleteDisease(id) {
    const ok = await confirmDialog({ title:'Delete Record?', message:'This will permanently remove this disease record.', confirmText:'Delete' });
    if (!ok) return;
    const res = await DiseasesAPI.remove(id);
    if (res !== null) { showToast('Record deleted.', 'success'); await init(); }
  }

  init();
</script>
</body>
</html>
