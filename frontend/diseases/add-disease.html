<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Disease — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content fade-in">
      <div class="page-header">
        <h1>🩺 Add Disease Record</h1>
        <a href="disease-history.html" class="btn btn-outline">View History</a>
      </div>

      <div class="glass" style="padding:32px;max-width:700px;">
        <form id="addDiseaseForm">
          <div class="input-group">
            <label>Patient *</label>
            <select id="diseasePatient" name="patient_id" required></select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
            <div class="input-group">
              <label>Disease Name *</label>
              <input type="text" name="disease_name" placeholder="Hypertension" required>
            </div>
            <div class="input-group">
              <label>Diagnosis Date *</label>
              <input type="date" name="diagnosis_date" required>
            </div>
            <div class="input-group">
              <label>Severity</label>
              <select name="severity">
                <option value="Mild">Mild</option>
                <option value="Moderate">Moderate</option>
                <option value="Severe">Severe</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
            <div class="input-group">
              <label>Status</label>
              <select name="status">
                <option value="Active">Active</option>
                <option value="Under Treatment">Under Treatment</option>
                <option value="Recovered">Recovered</option>
                <option value="Chronic">Chronic</option>
              </select>
            </div>
          </div>
          <div class="input-group">
            <label>Symptoms</label>
            <textarea name="symptoms" placeholder="e.g. High BP, headaches"></textarea>
          </div>
          <div class="input-group">
            <label>Description</label>
            <textarea name="description" placeholder="Clinical description"></textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
            <div class="input-group">
              <label>Treatment</label>
              <textarea name="treatment" placeholder="Treatment plan"></textarea>
            </div>
            <div class="input-group">
              <label>Prescribed Medicines</label>
              <textarea name="prescribed_meds" placeholder="e.g. Amlodipine 5mg"></textarea>
            </div>
            <div class="input-group">
              <label>Diagnosed By (Doctor)</label>
              <select id="diagnosedBy" name="diagnosed_by"><option value="">— Select Doctor —</option></select>
            </div>
            <div class="input-group">
              <label>Follow-up Date</label>
              <input type="date" name="follow_up_date">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">💾 Save Disease Record</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/diseases.js"></script>
  <script>fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});</script>
</body>
</html>
