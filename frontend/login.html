<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AWS Hospital Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>

  <div class="auth-wrapper">
    <div class="glass auth-card">
      <div class="logo-3d">🏥</div>
      <h1>AWS Hospital System</h1>
      <p class="subtitle">Sign in to access the dashboard</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="admin" required value="admin">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="admin123" required value="admin123">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:24px;">
        Demo credentials: <strong>admin / admin123</strong>
      </p>
      <a href="index.html" style="color:#64b5f6;font-size:13px;display:block;margin-top:12px;">← Back to Home</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      // Demo auth (in production this hits a Lambda auth endpoint + JWT)
      if (u === "admin" && p === "admin123") {
        localStorage.setItem("hms_token", "demo-token-" + Date.now());
        localStorage.setItem("hms_user", u);
        window.location.href = "dashboard.html";
      } else {
        const toast = document.createElement("div");
        toast.className = "toast toast-error show";
        toast.textContent = "Invalid credentials";
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }
    });
  </script>
</body>
</html>
