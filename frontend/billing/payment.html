<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content fade-in">
      <div class="page-header">
        <h1>💳 Record Payment</h1>
      </div>

      <div class="glass" style="padding:32px;max-width:700px;margin-bottom:24px;">
        <form id="paymentForm">
          <div class="input-group">
            <label>Select Bill *</label>
            <select id="paymentBill" name="bill_id" required></select>
          </div>
          <div class="input-group">
            <label>Patient *</label>
            <select id="paymentPatient" name="patient_id" required></select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
            <div class="input-group">
              <label>Amount Paid (₹) *</label>
              <input type="number" step="0.01" name="amount_paid" placeholder="1000" required>
            </div>
            <div class="input-group">
              <label>Payment Method *</label>
              <select name="payment_method" required>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="UPI">UPI</option>
                <option value="Insurance">Insurance</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Cheque">Cheque</option>
              </select>
            </div>
          </div>
          <div class="input-group">
            <label>Transaction ID</label>
            <input type="text" name="transaction_id" placeholder="TXN-XXXX">
          </div>
          <div class="input-group">
            <label>Remarks</label>
            <textarea name="remarks" placeholder="Optional notes"></textarea>
          </div>
          <button type="submit" class="btn btn-success btn-block">✅ Record Payment</button>
        </form>
        <p style="color:rgba(255,255,255,0.4);font-size:13px;text-align:center;margin-top:16px;">
          A payment receipt email will be sent automatically. Bill status auto-updates.
        </p>
      </div>

      <div class="glass table-wrapper">
        <h3 style="color:#fff;margin-bottom:16px;">📋 Payment History</h3>
        <table>
          <thead><tr><th>ID</th><th>Patient</th><th>Bill</th><th>Amount</th><th>Method</th><th>Date</th></tr></thead>
          <tbody id="paymentsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/billing.js"></script>
  <script>fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});</script>
</body>
</html>
