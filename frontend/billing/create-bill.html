<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Bill — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content fade-in">
      <div class="page-header">
        <h1>📝 Create Bill</h1>
        <a href="pending-dues.html" class="btn btn-outline">View Pending Dues</a>
      </div>

      <div class="glass" style="padding:32px;max-width:700px;margin-bottom:24px;">
        <form id="createBillForm">
          <div class="input-group">
            <label>Patient *</label>
            <select id="billPatient" name="patient_id" required></select>
          </div>
          <div class="input-group">
            <label>Description *</label>
            <textarea name="description" placeholder="e.g. Cardiology consultation + ECG" required></textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 20px;">
            <div class="input-group">
              <label>Category</label>
              <select name="category">
                <option value="Consultation">Consultation</option>
                <option value="Lab Test">Lab Test</option>
                <option value="Surgery">Surgery</option>
                <option value="Pharmacy">Pharmacy</option>
                <option value="Room">Room</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="input-group">
              <label>Amount (₹) *</label>
              <input type="number" step="0.01" name="amount" placeholder="1500" required>
            </div>
            <div class="input-group">
              <label>Discount (₹)</label>
              <input type="number" step="0.01" name="discount" placeholder="0" value="0">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">💾 Generate Bill</button>
        </form>
        <p style="color:rgba(255,255,255,0.4);font-size:13px;text-align:center;margin-top:16px;">
          A bill notification email will be sent to the patient via SES SMTP.
        </p>
      </div>

      <div class="glass table-wrapper">
        <h3 style="color:#fff;margin-bottom:16px;">📋 All Bills</h3>
        <table>
          <thead><tr><th>ID</th><th>Patient</th><th>Description</th><th>Category</th><th>Net Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="billsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/billing.js"></script>
  <script>fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});</script>
</body>
</html>
