<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content fade-in">
      <div class="page-header">
        <h1>📅 Doctor-Patient Appointments</h1>
        <a href="assign-doctor.html" class="btn btn-primary">➕ New Assignment</a>
      </div>

      <div class="glass table-wrapper">
        <table>
          <thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Specialization</th><th>Disease</th><th>Status</th><th>Appointment</th></tr></thead>
          <tbody id="assignmentsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/doctors.js"></script>
  <script>fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});</script>
</body>
</html>
