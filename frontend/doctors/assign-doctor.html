<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Doctor — AWS Hospital</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-3d"></div>
  <div class="grid-floor"></div>
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content fade-in">
      <div class="page-header">
        <h1>🔗 Assign Doctor to Patient</h1>
        <a href="appointments.html" class="btn btn-outline">View Appointments</a>
      </div>

      <div class="glass" style="padding:32px;max-width:700px;">
        <form id="assignDoctorForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
            <div class="input-group">
              <label>Patient *</label>
              <select id="assignPatient" name="patient_id" required></select>
            </div>
            <div class="input-group">
              <label>Doctor *</label>
              <select id="assignDoctor" name="doctor_id" required></select>
            </div>
            <div class="input-group" style="grid-column:1/3;">
              <label>Disease (optional)</label>
              <select id="assignDisease" name="disease_id"></select>
            </div>
            <div class="input-group">
              <label>Appointment Date</label>
              <input type="datetime-local" name="appointment_date">
            </div>
            <div class="input-group">
              <label>Status</label>
              <select name="status">
                <option value="Assigned">Assigned</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Active">Active</option>
              </select>
            </div>
            <div class="input-group">
              <label>Room Number</label>
              <input type="text" name="room_number" placeholder="C-101">
            </div>
            <div class="input-group" style="grid-column:1/3;">
              <label>Notes</label>
              <textarea name="notes" placeholder="Optional assignment notes"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">🔗 Assign Doctor</button>
        </form>
        <p style="color:rgba(255,255,255,0.4);font-size:13px;text-align:center;margin-top:16px;">
          An appointment confirmation email will be sent to the patient via SES SMTP.
        </p>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/doctors.js"></script>
  <script>fetch("../sidebar.html").then(r=>r.text()).then(h=>{document.getElementById("sidebar").innerHTML=h;});</script>
</body>
</html>
