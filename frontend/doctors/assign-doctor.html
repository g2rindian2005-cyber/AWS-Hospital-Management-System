<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Doctor — HealtheCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=7">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <div class="page-content fade-in">

      <div class="page-header">
        <div class="page-header-left">
          <h1>Schedule Appointment</h1>
          <p>Assign a doctor to a patient and schedule a consultation</p>
        </div>
        <div class="page-header-actions">
          <a href="appointments.html" class="btn btn-outline btn-sm">← View Appointments</a>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:2fr 1fr; gap:20px;">
        <div class="card">
          <div class="card-header">
            <div class="card-header-left"><h3>Appointment Details</h3><p>Fill in assignment information</p></div>
          </div>
          <div class="card-body">
            <form id="assignForm" novalidate>

              <div class="form-section">
                <div class="form-section-title">Patient & Doctor</div>
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label">Patient <span class="required">*</span></label>
                    <select class="form-control" id="patientId" required onchange="loadPatientDiseases()">
                      <option value="">— Select patient —</option>
                    </select>
                    <span class="form-error">Please select a patient.</span>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Doctor <span class="required">*</span></label>
                    <select class="form-control" id="doctorId" required onchange="updateDoctorInfo()">
                      <option value="">— Select doctor —</option>
                    </select>
                    <span class="form-error">Please select a doctor.</span>
                  </div>
                </div>

                <!-- Doctor info preview -->
                <div id="doctorPreview" style="display:none; background:var(--blue-50); border:1px solid var(--blue-100); border-radius:var(--radius); padding:14px 16px; margin-top:4px;">
                  <div class="d-flex align-center gap-12">
                    <div class="patient-avatar" id="doctorAvatarPrev">D</div>
                    <div>
                      <div class="fw-600" id="doctorNamePrev">—</div>
                      <div style="font-size:12px; color:var(--gray-500);" id="doctorSpecPrev">—</div>
                    </div>
                    <div style="margin-left:auto;" id="doctorAvailPrev"></div>
                  </div>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-title">Appointment Info</div>
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label">Appointment Date & Time <span class="required">*</span></label>
                    <input type="datetime-local" class="form-control" id="appointmentDate" required>
                    <span class="form-error">Please set appointment date and time.</span>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Room / Ward Number</label>
                    <input type="text" class="form-control" id="roomNumber" placeholder="e.g. C-101, ICU-3">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Disease / Condition</label>
                    <select class="form-control" id="diseaseId">
                      <option value="">— Select or type —</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Appointment Status</label>
                    <select class="form-control" id="assignStatus">
                      <option>Scheduled</option><option>Active</option><option>Completed</option>
                    </select>
                  </div>
                  <div class="form-group full">
                    <label class="form-label">Notes / Instructions</label>
                    <textarea class="form-control" id="notes" rows="3" placeholder="Any special instructions, pre-appointment requirements…"></textarea>
                  </div>
                </div>
              </div>

            </form>
          </div>
          <div class="card-footer">
            <button class="btn btn-outline" onclick="document.getElementById('assignForm').reset(); document.getElementById('doctorPreview').style.display='none';">Clear</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitAssignment()">Schedule Appointment</button>
          </div>
        </div>

        <!-- Side Info -->
        <div style="display:flex; flex-direction:column; gap:18px;">
          <div class="card">
            <div class="card-header"><div class="card-header-left"><h3>Available Doctors</h3></div></div>
            <div id="availDoctorList" style="padding:0 4px 8px;">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  initApp({ page: 'assign-doctor', title: 'Schedule Appointment', subtitle: 'Doctors' });

  let doctorsMap = {};

  async function init() {
    const now = new Date();
    now.setMinutes(0, 0, 0);
    now.setHours(now.getHours() + 1);
    document.getElementById('appointmentDate').value = now.toISOString().slice(0,16);

    const [pd, dd] = await Promise.all([PatientsAPI.list(), DoctorsAPI.list()]);

    const pSel = document.getElementById('patientId');
    (pd?.patients||[]).forEach(p => {
      const o = document.createElement('option'); o.value = p.patient_id;
      o.textContent = `PID-${String(p.patient_id).padStart(4,'0')} — ${p.first_name} ${p.last_name}`;
      pSel.appendChild(o);
    });

    const dSel = document.getElementById('doctorId');
    (dd?.doctors||[]).forEach(d => {
      doctorsMap[d.doctor_id] = d;
      const o = document.createElement('option'); o.value = d.doctor_id;
      o.textContent = `${d.first_name} ${d.last_name} — ${d.specialization} (${d.availability})`;
      dSel.appendChild(o);
    });

    /* Available doctors sidebar */
    const avail = (dd?.doctors||[]).filter(d => d.availability === 'Available');
    document.getElementById('availDoctorList').innerHTML = avail.length
      ? avail.map(d => `
        <div style="display:flex; align-items:center; gap:10px; padding:10px 20px; border-bottom:1px solid var(--gray-100); cursor:pointer;" onclick="document.getElementById('doctorId').value=${d.doctor_id}; updateDoctorInfo();">
          <div class="patient-avatar" style="width:32px;height:32px;font-size:11px;">${initials(d.first_name+' '+d.last_name)}</div>
          <div style="flex:1;">
            <div style="font-size:13px; font-weight:600;">${d.first_name} ${d.last_name}</div>
            <div style="font-size:11.5px; color:var(--gray-500);">${d.specialization}</div>
          </div>
          <span class="badge badge-success" style="font-size:10px;">Available</span>
        </div>`).join('')
      : `<div class="empty-state" style="padding:24px;"><p>No available doctors</p></div>`;
  }

  function updateDoctorInfo() {
    const id = document.getElementById('doctorId').value;
    const d  = doctorsMap[id];
    if (!d) { document.getElementById('doctorPreview').style.display = 'none'; return; }
    document.getElementById('doctorPreview').style.display = 'block';
    document.getElementById('doctorAvatarPrev').textContent = initials(`${d.first_name} ${d.last_name}`);
    document.getElementById('doctorNamePrev').textContent   = `${d.first_name} ${d.last_name}`;
    document.getElementById('doctorSpecPrev').textContent   = `${d.specialization} · ${d.department||'General'} · ${formatCurrency(d.consultation_fee)}/consult`;
    document.getElementById('doctorAvailPrev').innerHTML    = statusBadge(d.availability);
  }

  async function loadPatientDiseases() {
    const pid = document.getElementById('patientId').value;
    if (!pid) return;
    const data = await DiseasesAPI.forPatient(pid);
    const sel  = document.getElementById('diseaseId');
    sel.innerHTML = '<option value="">— Select condition —</option>';
    (data?.diseases || data || []).forEach(d => {
      const o = document.createElement('option'); o.value = d.disease_id;
      o.textContent = `${d.disease_name} (${d.severity})`;
      sel.appendChild(o);
    });
  }

  async function submitAssignment() {
    const required = ['patientId','doctorId','appointmentDate'];
    let valid = true;
    required.forEach(id => {
      const el = document.getElementById(id);
      if (!el.value) { el.classList.add('is-invalid'); valid = false; }
      else el.classList.remove('is-invalid');
    });
    if (!valid) { showToast('Please fill in all required fields.', 'warning'); return; }

    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Scheduling…'; btn.disabled = true;

    const body = {
      patient_id:       parseInt(document.getElementById('patientId').value),
      doctor_id:        parseInt(document.getElementById('doctorId').value),
      appointment_date: document.getElementById('appointmentDate').value,
      room_number:      document.getElementById('roomNumber').value.trim(),
      disease_id:       document.getElementById('diseaseId').value ? parseInt(document.getElementById('diseaseId').value) : null,
      status:           document.getElementById('assignStatus').value,
      notes:            document.getElementById('notes').value.trim(),
    };

    const res = await DoctorsAPI.assign(body);
    btn.textContent = 'Schedule Appointment'; btn.disabled = false;

    if (res) {
      showToast('Appointment scheduled successfully!', 'success');
      document.getElementById('assignForm').reset();
      document.getElementById('doctorPreview').style.display = 'none';
      document.getElementById('appointmentDate').value = new Date().toISOString().slice(0,16);
    }
  }

  init();
</script>
</body>
</html>
